name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20.x'

jobs:
  # Job 1: Code Quality & Testing
  quality-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Type checking
      run: npx tsc --noEmit
      
    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        
    # Optional: Add tests when you have them
    # - name: Run tests
    #   run: npm test

  # Job 2: Security Scanning
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: quality-checks
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level high --omit=dev || true
      
    - name: Run dependency check
      run: npx depcheck || echo "Dependency check completed with warnings"

  # Job 3: Deploy to Staging (develop branch)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [quality-checks, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Vercel (Staging)
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--env NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.STAGING_FIREBASE_API_KEY }}" --env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}" --env NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.STAGING_FIREBASE_PROJECT_ID }}" --env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}" --env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}" --env NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.STAGING_FIREBASE_APP_ID }}"'
        alias-domains: staging-threshold.vercel.app

  # Job 4: Deploy to Production (main branch)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-checks, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Vercel (Production)
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod --env NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.PROD_FIREBASE_API_KEY }}" --env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}" --env NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.PROD_FIREBASE_PROJECT_ID }}" --env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}" --env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}" --env NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.PROD_FIREBASE_APP_ID }}"'

  # Job 5: Notify on deployment
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Notify Success
      if: needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success'
      run: echo "🚀 Deployment successful!"
      
    - name: Notify Failure
      if: needs.deploy-production.result == 'failure' || needs.deploy-staging.result == 'failure'
      run: echo "❌ Deployment failed!"
